# Phase 3: the graph model.
# Trained on hall_a only. hall_b and hall_c are evaluated zero-shot with the same
# weights and the same normaliser -- statistics are never recomputed on the target
# hall, because that is leakage and it inflates the transfer numbers.

source_hall: hall_a
transfer_halls: [hall_b, hall_c]
horizons_s: [30, 60, 300]
seeds: [0, 1, 2, 3, 4]
lags: 6

split:
  train_frac: 0.70
  val_frac: 0.15

# One sample is a whole-hall snapshot, so 2,100 samples is 420,000 rack predictions --
# deliberately matched to the 400,000-row budget the LightGBM baseline gets, so the
# comparison is about the model rather than about how much data each one saw.
sample_stride: 20

model:
  # 64 rather than a larger width: message passing over a 200-rack hall costs about
  # 16 ms per sample on this machine either on MPS or on CPU, and the full sweep is
  # 3 horizons x 5 seeds. Early stopping on validation loss decides the real capacity
  # used; the smoke test reached LightGBM-level accuracy in 2 epochs.
  hidden: 64
  layers: 3
  heads: 4
  aggregation: attention
  use_edge_features: true
  dropout: 0.05

train:
  epochs: 20
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 5

graph:
  radius_m: 8.0
  max_rows_crossed: 3
  max_degree: 16
  crac_supply_racks: 24
