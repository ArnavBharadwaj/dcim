# Phase 3: the graph model.
# Trained on hall_a only. hall_b and hall_c are evaluated zero-shot with the same
# weights and the same normaliser -- statistics are never recomputed on the target
# hall, because that is leakage and it inflates the transfer numbers.

source_hall: hall_a
transfer_halls: [hall_b, hall_c]
horizons_s: [30, 60, 300]
seeds: [0, 1, 2, 3, 4]
lags: 6

split:
  train_frac: 0.70
  val_frac: 0.15

# One sample is a whole-hall snapshot, so 1,050 samples is 210,000 rack predictions,
# against the 400,000 rows LightGBM gets. Not matched, and the reason is the machine
# rather than the science -- see the note on batch_size below. Stated here so the
# comparison is read with that in mind.
sample_stride: 40

model:
  # 32 wide with 2 attention heads. This is a compute decision forced by the machine,
  # not a modelling one: message passing retains its intermediates for the backward
  # pass, and on 8.6 GB of unified memory with several GB already swapped, wider
  # settings fall off a swap cliff. Measured epoch times varied THIRTY-FOLD between
  # neighbouring configurations, and the same configuration measured 8.2 s/epoch in
  # isolation and 110 s/epoch in a full run minutes later, depending on the machine's
  # swap state. This is the most frugal point measured and it stays fast under load.
  # On a machine with headroom, raise to hidden 64 / heads 4 / batch 16 / stride 20.
  hidden: 32
  layers: 3
  heads: 2
  aggregation: attention
  use_edge_features: true
  dropout: 0.05

train:
  epochs: 15
  # Batch 8, not because it trains better but because this machine has 8.6 GB of
  # unified memory with several GB already swapped, and activation memory during
  # backprop hits a cliff. Measured, one epoch at stride 40:
  #
  #   hidden 64, batch 16, n=2100   279.6 s      hidden 48, batch 16, n=700   155.2 s
  #   hidden 32, batch 16, n=700      4.3 s      hidden 48, batch  4, n=420     5.4 s
  #   hidden 48, batch  8, n=1050     8.2 s   <- this configuration
  #
  # Thirty-fold differences between neighbouring settings are a swap cliff, not
  # compute. Batch 8 stays under it while keeping the data and the attention width.
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 4

graph:
  radius_m: 8.0
  max_rows_crossed: 3
  max_degree: 16
  crac_supply_racks: 24
