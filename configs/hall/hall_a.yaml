# hall_a -- the training hall. 200 racks, conventional hot-aisle/cold-aisle
# containment, 4 CRAC units at alternating ends of the hot aisles.
name: hall_a
rows: 10
racks_per_row: 20
orientation_pattern: paired

rack_width_m: 0.6
rack_depth_m: 1.2
aisle_width_m: 1.2

# Returns sit at the ends of hot aisles, alternating sides so no part of the hall
# is far from one. Hot aisles in this layout are -1, 1, 3, 5, 7, 9.
crac_units:
  - {aisle: 1, end: left}
  - {aisle: 3, end: right}
  - {aisle: 5, end: left}
  - {aisle: 7, end: right}
