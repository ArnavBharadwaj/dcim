# hall_b -- tests scale transfer. 140 racks, same containment and aisle pattern as
# hall_a, fewer rows and one fewer CRAC. Nothing about the physics changes; only the
# size of the graph and the geometry it induces.
name: hall_b
rows: 7
racks_per_row: 20
orientation_pattern: paired

rack_width_m: 0.6
rack_depth_m: 1.2
aisle_width_m: 1.2

crac_units:
  - {aisle: 1, end: left}
  - {aisle: 3, end: right}
  - {aisle: 5, end: left}
