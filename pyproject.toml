[project]
name = "dc-twin-gnn"
version = "0.1.0"
description = "Digital twin-assisted workload allocation and cooling optimisation with GNNs"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "gymnasium>=0.29",
    "torch>=2.4",
    "torch-geometric>=2.6",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# The Phase 0 probe found this machine is an Apple M2 running an x86_64 Homebrew
# and an x86_64 python.org Python. Pin an arm64 CPython so torch gets real wheels
# and MPS, rather than inheriting the Rosetta interpreter.
python-preference = "managed"
